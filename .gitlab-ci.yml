stages:
  - sync
  - compile
  - build
  - publish

variables:
  AIE_BRANCH: "aie"
  UPSTREAM_BRANCH: "main"
  PNPM_STORE_DIR: .pnpm-store

# Cache configuration
.bun_cache: &bun_cache
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
    policy: pull-push

# Base job template (FIXED: Node instead of Bun)
.base_job:
  image: node:22
  before_script:
    - node -v
    # Ensure Git LFS objects (e.g. the vendored ripgrep binaries under
    # vendor/ripgrep/) are materialized before install. The GitLab LFS endpoint
    # is on this host, so this works even with external network blocked.
    - command -v git-lfs >/dev/null 2>&1 || (apt-get update && apt-get install -y git-lfs)
    - git lfs install
    - git lfs pull
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm --version
  <<: *bun_cache


# Scheduled job: Check for new upstream tags and create MR
check_new_upstream_tags:
  stage: sync
  image: registry.gitlab.com/gitlab-org/cli:latest
  variables:
    GIT_DEPTH: 0
    GITLAB_HOST: gitlab.devops.telekom.de
  script:
    - apk add --no-cache git curl jq
    - git fetch --tags --force
    - |
      export GITLAB_TOKEN="${PROJECT_ACCESS_TOKEN:-$CI_JOB_TOKEN}"
      glab auth login --hostname "${GITLAB_HOST}" --token "${GITLAB_TOKEN}"
      glab auth status

    - |
      set -e
      ALL_TAGS=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')
      LATEST_UPSTREAM_TAG=$(echo "$ALL_TAGS" | head -1)

      [ -z "$LATEST_UPSTREAM_TAG" ] && exit 0

      AIE_TAG="${LATEST_UPSTREAM_TAG}-aie"
      [ -n "$(git tag -l "$AIE_TAG")" ] && exit 0

      UPSTREAM_COMMIT=$(git rev-list -n 1 "$LATEST_UPSTREAM_TAG")
      git merge-base --is-ancestor "$UPSTREAM_COMMIT" "origin/$AIE_BRANCH" && exit 0

      EXISTING_MRS=$(glab mr list --source-branch "$UPSTREAM_BRANCH" --target-branch "$AIE_BRANCH" --state opened || echo "")
      [ -n "$EXISTING_MRS" ] && exit 0

      [ -z "$PROJECT_ACCESS_TOKEN" ] && exit 1

      MR_TITLE="🔄 Upstream update: ${LATEST_UPSTREAM_TAG}"
      MR_DESCRIPTION="Automated MR to merge ${LATEST_UPSTREAM_TAG} into AIE."

      curl --request POST \
        --header "PRIVATE-TOKEN: ${PROJECT_ACCESS_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{
          \"source_branch\": \"${UPSTREAM_BRANCH}\",
          \"target_branch\": \"${AIE_BRANCH}\",
          \"title\": \"${MR_TITLE}\",
          \"description\": \"${MR_DESCRIPTION}\"
        }" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "aie"
      when: manual


compile:
  stage: compile
  extends: .base_job
  variables:
    NODE_OPTIONS: "--max-old-space-size=4096"
  script:
    - pnpm install --frozen-lockfile
    # - pnpm test --concurrency=1
    # - pnpm lint --concurrency=1
    # - pnpm check-types --concurrency=1
  rules:
    - if: $CI_COMMIT_BRANCH == "aie"
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-aie$/


build_package:
  extends: .base_job
  stage: build
  script:
    - pnpm install --frozen-lockfile
    - pnpm vsix
    - ls -la bin/
  artifacts:
    paths:
      - "src/package.json"
      - "bin/*.vsix"
  rules:
    - if: $CI_COMMIT_BRANCH == "aie"
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-aie$/


publish_prerelease:
  image: registry.gitlab.com/gitlab-org/cli:latest
  stage: publish
  needs: ["build_package"]
  variables:
    GIT_DEPTH: 0
    GITLAB_HOST: gitlab.devops.telekom.de
  before_script:
    - apk add --no-cache curl jq git git-lfs
    - git config user.email "ci@gitlab.com"
    - git config user.name "GitLab CI"
    - git remote set-url origin "https://oauth2:${PROJECT_ACCESS_TOKEN}@${GITLAB_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - git fetch --tags
    - export BASE_VERSION=$(jq -r '.version' src/package.json)

    - |
      EXISTING_TAGS=$(git tag -l "v${BASE_VERSION}-a.*" || echo "")

      if [ -z "$EXISTING_TAGS" ]; then
        NEXT_COUNTER=1
      else
        LATEST_COUNTER=$(echo "$EXISTING_TAGS" | sed "s/v${BASE_VERSION}-a\.//" | sort -n | tail -1)
        NEXT_COUNTER=$((LATEST_COUNTER + 1))
      fi

    - export PRERELEASE_VERSION="${BASE_VERSION}-a.${NEXT_COUNTER}"
    - export TAG_NAME="v${PRERELEASE_VERSION}"
    - export VSIX_FILE=$(ls bin/*.vsix | head -n1)

    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "${VSIX_FILE}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/zoocode-aie/${PRERELEASE_VERSION}/$(basename ${VSIX_FILE})"

    - git tag "$TAG_NAME"
    - git push origin "$TAG_NAME"

  rules:
    - if: $CI_COMMIT_BRANCH == "aie" && $CI_PIPELINE_SOURCE == "push"


publish_stable:
  image: node:22
  stage: publish
  needs: ["build_package"]
  script:
    - apt-get update && apt-get install -y curl jq
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        PACKAGE_VERSION="${CI_COMMIT_TAG#v}"
      else
        PACKAGE_VERSION=$(jq -r '.version' src/package.json)
      fi

    - export VSIX_FILE=$(ls bin/*.vsix | head -n1)

    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "${VSIX_FILE}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/zoocode-aie/${PACKAGE_VERSION}/$(basename ${VSIX_FILE})"

  artifacts:
    paths:
      - "bin/*.vsix"

  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-aie$/
